<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Haven — application Android Weidler Studio">
  <title>Haven — Weidler Studio</title>
  <link rel="stylesheet" href="../../css/site.css">
</head>
<body data-page="haven">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../../index.html" data-i18n="brand">Weidler Studio</a>
      <nav class="nav" aria-label="Main">
        <a data-nav="home" href="../../index.html" data-i18n="navHome">Accueil</a>
        <a data-nav="hk" href="../hk-crib-go/" data-i18n="navHk">HK Crib Go</a>
        <a data-nav="haven" href="./" data-i18n="navHaven">Haven</a>
        <a data-nav="contact" href="../../index.html#contact" data-i18n="navContact">Contact</a>
      </nav>
      <div class="lang" id="langSwitcher" aria-label="Language"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="app-hero">
      <div class="app-hero__visual">
        <img src="../../assets/haven/01-accueil.png" alt="Haven" width="460" height="920" loading="eager">
      </div>
      <div>
        <p class="page-kicker" data-i18n="havenPageKicker">Application</p>
        <h1 data-i18n="havenPageTitle">Haven</h1>
        <p class="lead" data-i18n="havenPageLead"></p>
      </div>
    </section>

    <section class="section section--white" aria-labelledby="haven-gallery">
      <h2 id="haven-gallery" data-i18n="galleryTitle">Galerie</h2>
      <div class="gallery">
        <figure>
          <a href="../../assets/haven/haven.png" target="_blank" rel="noopener">
            <img src="../../assets/haven/haven.png" alt="" loading="lazy">
            <figcaption data-i18n="havenCapHero">Haven</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/haven/01-accueil.png" target="_blank" rel="noopener">
            <img src="../../assets/haven/01-accueil.png" alt="" loading="lazy">
            <figcaption data-i18n="havenCapAccueil">Accueil</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/haven/haven-accueil.png" target="_blank" rel="noopener">
            <img src="../../assets/haven/haven-accueil.png" alt="" loading="lazy">
            <figcaption data-i18n="havenCapAccueil">Accueil et modes</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/haven/02-historique.png" target="_blank" rel="noopener">
            <img src="../../assets/haven/02-historique.png" alt="" loading="lazy">
            <figcaption data-i18n="havenCapHistorique">Historique</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/haven/haven-historique.png" target="_blank" rel="noopener">
            <img src="../../assets/haven/haven-historique.png" alt="" loading="lazy">
            <figcaption data-i18n="havenCapHistorique">Historique</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/haven/03-horaire.png" target="_blank" rel="noopener">
            <img src="../../assets/haven/03-horaire.png" alt="" loading="lazy">
            <figcaption data-i18n="havenCapHoraire">Horaire</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/haven/haven-horaire.png" target="_blank" rel="noopener">
            <img src="../../assets/haven/haven-horaire.png" alt="" loading="lazy">
            <figcaption data-i18n="havenCapHoraire">Horaire automatique</figcaption>
          </a>
        </figure>
      </div>
    </section>

    <section class="section" aria-labelledby="haven-features">
      <h2 id="haven-features" data-i18n="featuresTitle">Fonctionnalités et options</h2>
      <ul class="feature-list">
        <li data-i18n-html="havenFeat1"></li>
        <li data-i18n-html="havenFeat2"></li>
        <li data-i18n-html="havenFeat3"></li>
        <li data-i18n-html="havenFeat4"></li>
        <li data-i18n-html="havenFeat5"></li>
        <li data-i18n-html="havenFeat6"></li>
      </ul>
    </section>

    <section class="section section--white" id="confidentialite" aria-labelledby="haven-privacy">
      <h2 id="haven-privacy" data-i18n="privacyTitle">Politique de confidentialité</h2>
      <div class="accordion" id="privacyAccordion" data-app="haven"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap" data-i18n="footer">© Weidler Studio</div>
  </footer>

  <script src="../../js/i18n.js"></script>
  <script src="../../js/site.js"></script>
</body>
</html>
