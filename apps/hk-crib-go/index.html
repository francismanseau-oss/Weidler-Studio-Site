<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HK Crib Go — application Android Weidler Studio">
  <title>HK Crib Go — Weidler Studio</title>
  <link rel="stylesheet" href="../../css/site.css">
</head>
<body data-page="hk">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../../index.html" data-i18n="brand">Weidler Studio</a>
      <nav class="nav" aria-label="Main">
        <a data-nav="home" href="../../index.html" data-i18n="navHome">Accueil</a>
        <a data-nav="hk" href="./" data-i18n="navHk">HK Crib Go</a>
        <a data-nav="haven" href="../haven/" data-i18n="navHaven">Haven</a>
        <a data-nav="contact" href="../../index.html#contact" data-i18n="navContact">Contact</a>
      </nav>
      <div class="lang" id="langSwitcher" aria-label="Language"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="app-hero">
      <div class="app-hero__visual">
        <img src="../../assets/hk/partie-en-cours.png" alt="HK Crib Go" width="460" height="920" loading="eager">
      </div>
      <div>
        <p class="page-kicker" data-i18n="hkPageKicker">Application</p>
        <h1 data-i18n="hkPageTitle">HK Crib Go</h1>
        <p class="lead" data-i18n="hkPageLead"></p>
      </div>
    </section>

    <section class="section section--white" aria-labelledby="hk-gallery">
      <h2 id="hk-gallery" data-i18n="galleryTitle">Galerie</h2>
      <div class="gallery">
        <figure>
          <a href="../../assets/hk/partie-en-cours.png" target="_blank" rel="noopener">
            <img src="../../assets/hk/partie-en-cours.png" alt="" loading="lazy">
            <figcaption data-i18n="hkCapPartieAlt">Partie contre l’IA</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/hk/hk-partie.png" target="_blank" rel="noopener">
            <img src="../../assets/hk/hk-partie.png" alt="" loading="lazy">
            <figcaption data-i18n="hkCapPartie">Partie en cours</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/hk/hk-pointage.png" target="_blank" rel="noopener">
            <img src="../../assets/hk/hk-pointage.png" alt="" loading="lazy">
            <figcaption data-i18n="hkCapPointage">Pointage</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/hk/menu-parametres.png" target="_blank" rel="noopener">
            <img src="../../assets/hk/menu-parametres.png" alt="" loading="lazy">
            <figcaption data-i18n="hkCapMenu">Fin d’un round</figcaption>
          </a>
        </figure>
        <figure>
          <a href="../../assets/hk/hk-support.png" target="_blank" rel="noopener">
            <img src="../../assets/hk/hk-support.png" alt="" loading="lazy">
            <figcaption data-i18n="hkCapSupport">Centre de support</figcaption>
          </a>
        </figure>
      </div>
    </section>

    <section class="section" aria-labelledby="hk-howto">
      <h2 id="hk-howto" data-i18n="hkHowTitle">Comment jouer</h2>
      <div class="prose" data-i18n-html="hkHowBody"></div>
    </section>

    <section class="section section--white" aria-labelledby="hk-score">
      <h2 id="hk-score" data-i18n="hkScoreTitle">Comment compter les points</h2>
      <div class="prose" data-i18n-html="hkScoreBody"></div>
    </section>

    <section class="section" aria-labelledby="hk-options">
      <h2 id="hk-options" data-i18n="hkOptionsTitle">Options : dos de cartes et plateaux</h2>
      <div class="prose" data-i18n-html="hkOptionsBody"></div>
    </section>

    <section class="section section--white" aria-labelledby="hk-features">
      <h2 id="hk-features" data-i18n="featuresTitle">Fonctionnalités et options</h2>
      <ul class="feature-list">
        <li data-i18n-html="hkFeat1"></li>
        <li data-i18n-html="hkFeat2"></li>
        <li data-i18n-html="hkFeat3"></li>
        <li data-i18n-html="hkFeat4"></li>
        <li data-i18n-html="hkFeat5"></li>
        <li data-i18n-html="hkFeat6"></li>
      </ul>
    </section>

    <section class="section" id="confidentialite" aria-labelledby="hk-privacy">
      <h2 id="hk-privacy" data-i18n="privacyTitle">Politique de confidentialité</h2>
      <div class="accordion" id="privacyAccordion" data-app="hk"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap" data-i18n="footer">© Weidler Studio</div>
  </footer>

  <script src="../../js/i18n.js"></script>
  <script src="../../js/site.js"></script>
</body>
</html>
