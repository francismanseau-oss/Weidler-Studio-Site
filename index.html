<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Weidler Studio — HK Crib Go et Haven, applications Android pour Google Play.">
  <title>Weidler Studio</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="home">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" data-i18n="brand">Weidler Studio</a>
      <nav class="nav" aria-label="Main">
        <a data-nav="home" href="index.html" data-i18n="navHome">Accueil</a>
        <a data-nav="hk" href="apps/hk-crib-go/" data-i18n="navHk">HK Crib Go</a>
        <a data-nav="haven" href="apps/haven/" data-i18n="navHaven">Haven</a>
        <a data-nav="contact" href="#contact" data-i18n="navContact">Contact</a>
      </nav>
      <div class="lang" id="langSwitcher" aria-label="Language"></div>
    </div>
  </header>

  <main class="wrap">
    <h1 class="hero-title" data-i18n="homeTitle">Weidler Studio crée des applications</h1>
    <p class="hero-lead" data-i18n="homeLead"></p>

    <section class="apps" aria-label="Applications">
      <a class="app-card" href="apps/hk-crib-go/">
        <div class="app-card__shot">
          <img src="assets/hk/partie-en-cours.png" alt="HK Crib Go" width="460" height="920" loading="eager">
        </div>
        <div class="app-card__body">
          <h2 data-i18n="hkCardTitle">HK Crib Go</h2>
          <p data-i18n="hkCardDesc"></p>
          <span class="btn" data-i18n="discover">Découvrir</span>
        </div>
      </a>

      <a class="app-card" href="apps/haven/">
        <div class="app-card__shot">
          <img src="assets/haven/01-accueil.png" alt="Haven" width="460" height="920" loading="eager">
        </div>
        <div class="app-card__body">
          <h2 data-i18n="havenCardTitle">Haven</h2>
          <p data-i18n="havenCardDesc"></p>
          <span class="btn" data-i18n="discover">Découvrir</span>
        </div>
      </a>
    </section>

    <section class="contact-box" id="contact">
      <h2 data-i18n="contactTitle">Contact</h2>
      <p data-i18n="contactBody"></p>
      <p><a id="contactEmail" href="mailto:contact@weidlerstudio.com">contact@weidlerstudio.com</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap" data-i18n="footer">© Weidler Studio</div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
